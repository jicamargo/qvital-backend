# Zonas y fichas Cuerpo-Emoción — body_system: piel
body_system: piel
regions:
  - name: Piel
    display_order: 1
    illustration_ref: todo_cuerpo
    insight:
      symptom_pattern: >-
        Brotes, picazón, enrojecimiento, resequedad o irritación en la piel que aparecen o empeoran en épocas de
        estrés o de conflictos con otras personas, sin una causa clínica identificada.
      emotional_theme: Contacto, límites y separación; cómo nos relacionamos con los demás
      narrative_explanation: >-
        La piel es la frontera entre nosotros y el mundo: es lo primero que toca y es tocado, y lo que nos protege.
        Es conocido que el estrés influye en muchas condiciones de la piel. En el campo cuerpo-emoción, la piel se
        asocia con el contacto y los límites: la necesidad de cercanía y afecto físico, la dificultad para poner
        límites a otros ("me saca de quicio", "me tiene hasta la coronilla"), o una separación dolorosa de alguien
        importante. También se lee en ella la preocupación por la imagen y por lo que los demás piensan. Es una
        invitación a mirar cómo estás viviendo tus relaciones y tus fronteras personales.
      reflective_questions:
        - "¿Hay alguien que sientes que invade tu espacio o 'se te mete debajo de la piel'?"
        - "¿Has vivido recientemente una separación o distancia de alguien importante?"
        - "¿Cuánto te preocupa lo que los demás ven o piensan de ti?"
      integration_guidance: >-
        Cuidar la piel con gestos simples: agua suficiente, un hidratante suave y evitar rascarse. Tomarte unos
        minutos para aplicar la crema con calma, como un acto de cuidado propio. Identificar un límite que
        necesitas poner con alguien y ensayar una frase corta para decirlo. Si hay heridas, manchas que cambian de
        forma o color, ampollas, fiebre o la irritación persiste, consultar con un dermatólogo o un profesional de
        salud.
      practices:
        - title: Crema con calma
          description: Aplica tu crema despacio, como un momento de cuidado para ti.
        - title: Un vaso de agua más
          description: Suma un vaso de agua al día y nota cómo se siente tu piel.
        - title: Una frase para mi límite
          description: Piensa en un límite que necesitas poner y ensaya una frase corta para decirlo.
      severity_flag: informativo
      tags:
