- title: "Quiche Proteico de Poro"
  slug: "quiche-proteico-de-poro"
  image_local_path: "/mnt/d/USUARIO/OneDrive/Documentos/hlf/Libros Mi nutricion Favorita/imagenes/Tomo2-Quiche Proteico de Poro.jpg"
  description: "Quiche horneado con masa proteica de harina de trigo y avena y relleno cremoso de poro salteado, huevo, requesón y leche."
  servings: 8
  recipe_type: "comida"
  difficulty: "media"
  calories: 141
  protein_g: 9.0
  carbs_g: 17.0
  fat_g: 4.0
  fiber_g: null
  tips: null
  source: "Mi Nutrición Favorita, Tomo 2, pág. 10"
  instructions:
    - "Combinar la harina con la Proteína Personalizada en Polvo y colocar sobre una superficie lisa. Mezclar y abrir un agujero en el medio, añadir margarina, avena y sal, y amasar añadiendo el agua poco a poco. Llevar la masa a refrigerar durante 20 minutos."
    - "En una sartén, dorar el poro por 5 minutos aproximadamente, luego condimentar con sal y pimienta. Separar una clara de los dos huevos y batir ligeramente el huevo con la yema, agregar el requesón y leche. Añadir el poro. Probar la sazón. Reservar."
    - "Calentar el horno en temperatura media; mientras, estirar la masa con un rodillo para colocarla en un molde resistente a horno. Pincelar la masa con la clara previamente separada del huevo antes de llevarla al horno durante 5-10 minutos a 175 °C."
    - "Retirar del horno y verter la preparación sobre el molde previamente cocido. Finalmente, cocinar en el horno por 30 minutos a 175 °C."
  ingredients:
