  instructions:
    - "Mezcla las harinas y el Protein Drink Mix. Aparte, bate las claras a punto nieve y reserva."
    - "En otro bowl, coloca las yemas, vainilla y panela, batir a punto nieve."
    - "Mezcla las claras y yemas ya batidas de forma envolvente. Tamiza y mezcla las harinas de a pocos en forma envolvente."
    - "Pon la mezcla en un molde y hornea a 170° por 45 minutos."
    - "Para el relleno: divide en dos partes el yogur. En la primera mezcla echa el Batido Nutricional Fórmula 1 sabor chocoavellana, el Batido Nutricional Fórmula 1 sabor café latte y 1 cuchara medidora de Protein Drink Mix, echa un chorro de agua y mezcla bien hasta que no queden grumos, logra una mezcla espesa."
