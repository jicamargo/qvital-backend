    - "Una vez listo el queque, corta en 3 partes. En la primera capa, coloca la mezcla de chocolate y añade la siguiente capa para colocar la mezcla de fresa y cubre con la última capa. ¡Decora con un poco más de mezcla y tu fruta favorita!"
