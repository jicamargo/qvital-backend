- title: "Torta de Chocofresa"
  slug: "torta-de-chocofresa"
  image_local_path: "/mnt/d/USUARIO/OneDrive/Documentos/hlf/Libros Mi nutricion Favorita/imagenes/Tomo4-Torta de Chocofresa.jpg"
  description: "Torta en capas horneada a base de harinas de soya, quinua y avena con Protein Drink Mix, rellena entre capas con dos cremas de yogur natural: una de Fórmula 1 sabor chocoavellana y café latte, y otra de Fórmula 1 sabor fresa y Beverage Mix."
  servings: 8
  recipe_type: "postre"
  difficulty: "dificil"
  calories: 234
