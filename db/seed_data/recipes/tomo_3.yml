- title: Galletas Proteicas con Parmesano
  slug: galletas-proteicas-con-parmesano
  description: Galletas saladas horneadas a base de proteína en polvo, harinas y queso parmesano, cubiertas con semillas de amapola y sésamo antes de hornearlas por ambos lados hasta dorar.
  servings: 40
  recipe_type: snack
  difficulty: dificil
  calories: 24
  protein_g: 0.6
  carbs_g: 2.3
  fat_g: 1.4
  fiber_g: 0.3
  tips: null
  source: Mi Nutrición Favorita, Tomo 3, pág. 20
  instructions:
    - Precalienta el horno a 425º. Engrasa ligeramente una bandeja para hornear.
    - "Para la cobertura: mezcla las semillas de amapola y de sésamo en un tazón pequeño y reserva."
    - "Para las galletas saladas: coloca las harinas, la Proteína Personalizada en Polvo, el parmesano, cebolla en polvo, ajo en polvo, sal, azúcar y pimienta en el tazón del procesador de alimentos y mezcla."
    - Agrega aceite y sigue mezclando. Con la máquina en funcionamiento, agrega agua lentamente, hasta formar una bola.
    - Envuelve la masa en film transparente y déjala reposar 15 minutos a temperatura ambiente.
    - Trabajando con la mitad de la masa, enrolla sobre una tabla ligeramente enharinada hasta que quede muy fina. Córtala en cuadrados o círculos y ponla en una bandeja para hornear.
    - Unta las galletas con agua y espolvorea con la mezcla de semillas, presionando suavemente para ayudar a que las semillas se adhieran. Espolvorea con sal, si lo deseas.
    - Hornea durante unos 12-13 minutos hasta que un lado esté bien dorado; repite lo mismo para el otro lado.
    - Deja enfriar completamente. Las galletas se pondrán más crujientes a medida que se enfríen.
  ingredients:
