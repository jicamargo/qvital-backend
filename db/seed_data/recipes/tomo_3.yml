- title: Pollo Cítrico Glaseado
  slug: pollo-citrico-glaseado
  description: Filetes de pollo marinados en salsa de soya, vinagre de arroz, jengibre y ajo, sellados en sartén y glaseados con Herbal Aloe Concentrado sabor mandarina.
  servings: 3
  recipe_type: comida
  difficulty: dificil
  calories: 201
  protein_g: 33.5
  carbs_g: 4.7
  fat_g: 5.4
  fiber_g: 0.1
  tips: null
  source: Mi Nutrición Favorita, Tomo 3, pág. 19
  instructions:
    - En una fuente grande y plana, mezcla la salsa de soya, el vinagre, la pimienta, el ajo en polvo y el jengibre.
    - Agrega los filetes de pollo y marínalo por ambos lados. Cúbrelo con papel film y refrigera por varias horas o toda la noche.
    - Vierte el aceite en una sartén grande y calienta a fuego medio-alto hasta que el aceite brille.
    - Retira el pollo de la marinada y resérvala. Agrega los filetes de pollo en una sola capa y cocina 2-3 minutos hasta que esté bien dorado en la parte inferior.
    - Dale vuelta a las piezas y continúa cocinando otros 2-3 minutos hasta que estén bien cocidas. Transfiere el pollo a un plato y reserva.
    - Vierte la marinada en una sartén y cocina, revolviendo hasta que espese un poco y se reduzca a un glaseado, aproximadamente 1-2 minutos.
    - Agrega el Herbal Aloe Concentrado sabor mandarina y mezcla. Regresa los trozos de pollo a la sartén y gíralos para cubrirlos con el glaseado.
  ingredients:
    - name: Herbal Aloe Concentrado - Mandarina
      sku: "2631"
      quantity: 2 tapitas
      is_optional: false
    - name: Filetes de pollo sin grasa
      sku: null
      quantity: 575 g (9 a 10 piezas)
      is_optional: false
    - name: Salsa de soya
      sku: null
      quantity: 2 cucharadas
      is_optional: false
    - name: Vinagre de arroz
      sku: null
      quantity: 1 cucharada
      is_optional: false
    - name: Pimienta negra molida
      sku: null
      quantity: ¾ de cucharadita
      is_optional: false
    - name: Ajo en polvo
      sku: null
      quantity: ¼ de cucharadita
      is_optional: false
    - name: Jengibre en polvo
      sku: null
      quantity: ½ cucharadita
      is_optional: false
